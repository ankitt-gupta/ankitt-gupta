name: Update Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual run anytime
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Triggers when this file changes

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: ${{ github.repository_owner }}
          theme: tokyonight
          hide_border: true
          timezone: "+5:30"
          output: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated SVG
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore(stats): update streak card [skip ci]" || exit 0
          git push
